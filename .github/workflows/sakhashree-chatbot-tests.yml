name: Sakhashree chatbot tests

on:
  push:
    branches:
      - feature/conversation-intelligence
  pull_request:
    branches:
      - parth

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, curl, dom, fileinfo, mbstring, openssl, pdo, pdo_sqlite, sqlite3, tokenizer, xml
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lint PHP files changed by this feature
        run: |
          php -l app/Services/SakhashreeIntentRouter.php
          php -l app/Http/Controllers/SakhashreeChatbotController.php
          php -l config/services.php
          php -l tests/Unit/SakhashreeIntentRouterTest.php
          php -l tests/Feature/SakhashreeChatbotFlowTest.php

      - name: Run chatbot regression tests
        run: php artisan test --filter=Sakhashree
