name: Sakhashree chatbot tests

on:
  push:
    branches:
      - feature/conversation-intelligence
  pull_request:
    branches:
      - parth

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, curl, dom, fileinfo, mbstring, openssl, pdo, pdo_sqlite, sqlite3, tokenizer, xml
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lint PHP files
        run: find app tests config -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run tests
        run: php artisan test
