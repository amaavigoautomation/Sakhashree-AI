<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Upload an image</title>
    <script type="text/javascript" src="js/dialog-v4.js"></script>
    <link href="css/dialog-v4.css" rel="stylesheet" type="text/css">
</head>

<body>

    <form class="form-inline" id="upl" name="upl" action="../../../../../posts/image_upload" method="post" enctype="multipart/form-data" target="upload_target" onsubmit="jbImagesDialog.inProgress();">
         <!-- CSRF Token (Will be filled dynamically) -->
         <input type="hidden" name="_token" value="">

        <div id="upload_in_progress" class="upload_infobar"><img src="img/spinner.gif" width="16" height="16" class="spinner">Upload in progress&hellip;
            <div id="upload_additional_info"></div>
        </div>
        <div id="upload_infobar" class="upload_infobar"></div>

        <p id="upload_form_container">
            <input id="uploader" name="userfile" type="file" class="jbFileBox" onChange="document.upl.submit(); jbImagesDialog.inProgress();">
        </p>
    </form>

    <iframe id="upload_target" name="upload_target" src="ci/index.php?blank"></iframe>

     <script>
        document.addEventListener("DOMContentLoaded", function () {
        fetch('../../../../../csrf-token', {
            headers: { 'Accept': 'application/json' }
        })
        .then(response => response.json())
        .then(data => {
            let csrfInput = document.querySelector('input[name="_token"]');
            if (csrfInput) {
                csrfInput.value = data.csrf_token;
            }
        })
        .catch(error => console.error('Error fetching CSRF token:', error));
    });
    </script>

</body>

</html>
